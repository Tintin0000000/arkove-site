<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro YouTube finance</title>
  <link rel="stylesheet" href="../motion.css">
  <style>
    #cam { position: absolute; inset: 0; transform-origin: 70% 40%; }
    .chart { position: absolute; inset: 0; }
    .eyebrow {
      left: 140px; top: 330px;
      font: 700 26px var(--mono); letter-spacing: 0.32em; color: var(--gold);
      white-space: nowrap;
    }
    .eyebrow .caret { display: inline-block; width: 14px; height: 30px; background: var(--gold); vertical-align: -5px; margin-left: 6px; }
    .title {
      left: 130px; top: 390px; width: 900px;
      font: 400 156px/0.98 var(--serif); letter-spacing: -0.01em;
      text-shadow: 0 0 60px #0d0c0a, 0 0 30px #0d0c0a;
    }
    .title .gold { font-style: italic; color: var(--gold-soft); }
    .underline { left: 0; height: 8px; background: var(--gold); transform-origin: 0 50%; border-radius: 4px; }
    .counter { right: 140px; top: 150px; text-align: right; }
    .counter .lbl { font: 700 22px var(--mono); letter-spacing: 0.25em; color: var(--ink-soft); }
    .counter .val { font: 700 96px var(--mono); color: var(--up); letter-spacing: -0.03em; }
    .ticker {
      left: 0; right: 0; bottom: 0; height: 84px;
      background: #000; border-top: 1px solid #2e2a22;
      display: flex; align-items: center; overflow: hidden;
    }
    .ticker .track { display: flex; gap: 70px; white-space: nowrap; font: 500 28px var(--mono); padding-left: 60px; }
    .ticker b { color: var(--ink); font-weight: 700; margin-right: 14px; }
    .ticker .u { color: var(--up); }
    .ticker .d { color: var(--down); }
    .outro { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
    .logo {
      width: 230px; height: 230px; border-radius: 50%;
      background: var(--gold); color: #171310;
      display: flex; align-items: center; justify-content: center;
      font: 400 150px var(--serif); line-height: 1;
      box-shadow: 0 0 120px -10px rgba(206, 155, 76, 0.7);
    }
    .handle { font: 600 54px var(--sans); letter-spacing: -0.01em; }
    .handle span { color: var(--gold-soft); }
    .wipe { top: 0; bottom: 0; width: 2400px; left: -2400px; background: linear-gradient(90deg, transparent, var(--gold) 40%, var(--gold-soft) 60%, transparent); }
  </style>
</head>
<body>
  <div class="frame"><div id="stage">
    <div id="cam">
      <div class="gridbg"></div>
      <svg class="chart" viewBox="0 0 1920 1080">
        <defs>
          <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ce9b4c" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#ce9b4c" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="reveal"><rect id="revealRect" x="0" y="0" width="0" height="1080"/></clipPath>
        </defs>
        <g id="candles"></g>
        <path id="areaPath" fill="url(#area)" clip-path="url(#reveal)"/>
        <path id="line" fill="none" stroke="#e8c27a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
        <circle id="ring" r="14" fill="none" stroke="#e8c27a" stroke-width="3"/>
        <circle id="dot" r="12" fill="#fff"/>
      </svg>

      <div class="abs counter">
        <div class="lbl">PERFORMANCE</div>
        <div class="val" id="val">+0,0 %</div>
      </div>
      <div class="abs eyebrow"><span id="eyebrowText"></span><span class="caret" id="caret"></span></div>
      <h1 class="abs title" id="title">Faire travailler <span class="gold">son argent</span></h1>

      <div class="abs ticker">
        <div class="track" id="track"></div>
      </div>
    </div>

    <div class="abs wipe" id="wipe"></div>
    <div class="abs outro" id="outro">
      <div class="logo" id="logo">€</div>
      <div class="handle" id="handle">@ta<span>chaine</span></div>
    </div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div></div>

  <script src="../engine.js"></script>
  <script>
    const { prog, ease, lerp, clamp, rng, splitWords } = M;
    const EYEBROW = 'ÉPISODE 01 · FINANCE PERSO';
    // Valeurs illustratives, pas des cours réels.
    const TICKS = [['CAC 40', '+1,24 %', 'u'], ['S&P 500', '+0,82 %', 'u'], ['NASDAQ', '+1,57 %', 'u'], ['BTC', '−2,10 %', 'd'], ['OR', '+0,41 %', 'u'], ['EUR/USD', '−0,12 %', 'd'], ['MSCI WORLD', '+0,96 %', 'u']];

    M.scene({
      width: 1920, height: 1080, duration: 7,
      setup() {
        // Courbe : tendance haussière + bruit + un petit krach au milieu.
        const r = rng(7), pts = [];
        const N = 46;
        for (let i = 0; i <= N; i++) {
          const x = (i / N) * 1920;
          const trend = 900 - Math.pow(i / N, 1.6) * 640;
          const crash = i > 20 && i < 28 ? Math.sin(((i - 20) / 8) * Math.PI) * 120 : 0;
          pts.push([x, trend + crash + (r() - 0.5) * 70]);
        }
        const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
        const line = document.getElementById('line');
        line.setAttribute('d', d);
        document.getElementById('areaPath').setAttribute('d', d + ' L1920 1080 L0 1080 Z');
        const len = line.getTotalLength();
        line.style.strokeDasharray = len;

        // Bougies en arrière-plan, alignées sur la courbe.
        const g = document.getElementById('candles');
        const candles = [];
        for (let i = 1; i < N; i++) {
          const [x, y] = pts[i];
          const up = pts[i][1] < pts[i - 1][1];
          const h = 30 + r() * 70;
          const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          el.innerHTML = `<line x1="${x}" x2="${x}" y1="${y - h * 0.9}" y2="${y + h * 0.9}" stroke="currentColor" stroke-width="3"/>
            <rect x="${x - 11}" y="${y - h / 2}" width="22" height="${h}" rx="3" fill="currentColor"/>`;
          el.style.color = up ? '#3fd68b' : '#ff5a5f';
          el.style.transformOrigin = `${x}px ${y}px`;
          g.appendChild(el);
          candles.push({ el, x });
        }

        document.getElementById('track').innerHTML = [...TICKS, ...TICKS, ...TICKS]
          .map(([n, v, c]) => `<span><b>${n}</b><span class="${c}">${v}</span></span>`).join('');

        // Le titre est découpé en mots ; on remet l'italique doré sur « son argent »
        // et on place le soulignement sous la 2e ligne, mesurée après découpe.
        const title = document.getElementById('title');
        const words = splitWords(title);
        words.slice(2).forEach((w) => w.classList.add('gold'));
        const [a, b] = [...title.querySelectorAll('.w')].slice(2);
        const underline = document.createElement('div');
        underline.className = 'abs underline';
        underline.id = 'underline';
        underline.style.left = a.offsetLeft + 'px';
        underline.style.top = a.offsetTop + a.offsetHeight + 14 + 'px';
        underline.style.width = b.offsetLeft + b.offsetWidth - a.offsetLeft + 'px';
        title.appendChild(underline);

        return { line, len, candles, words, y0: pts[0][1], yEnd: pts[N][1] };
      },
      render(t, c) {
        // Caméra : légère poussée continue.
        const cam = document.getElementById('cam');
        const camOut = prog(t, 5.2, 0.9, ease.inCubic);
        cam.style.transform = `scale(${1.04 - t * 0.006 + camOut * 0.12}) translateX(${-t * 6}px)`;
        cam.style.opacity = 1 - camOut;
        cam.style.filter = `blur(${camOut * 14}px)`;

        // Courbe qui se dessine + point de tête.
        const draw = prog(t, 0.15, 3.1, ease.outCubic);
        c.line.style.strokeDashoffset = c.len * (1 - draw);
        const head = c.line.getPointAtLength(c.len * Math.max(draw, 0.0001));
        document.getElementById('revealRect').setAttribute('width', head.x);
        const dot = document.getElementById('dot'), ring = document.getElementById('ring');
        dot.setAttribute('cx', head.x); dot.setAttribute('cy', head.y);
        ring.setAttribute('cx', head.x); ring.setAttribute('cy', head.y);
        const pulse = (t * 1.4) % 1;
        ring.setAttribute('r', 12 + pulse * 40);
        ring.style.opacity = (1 - pulse) * prog(t, 0.2, 0.3);
        dot.style.opacity = prog(t, 0.2, 0.2);

        // Bougies : elles poussent quand la tête de courbe les dépasse.
        c.candles.forEach(({ el, x }) => {
          const p = clamp((head.x - x + 40) / 160);
          el.style.transform = `scaleY(${ease.outBack(p)})`;
          el.style.opacity = p * 0.28;
        });

        // Compteur de performance.
        // Compteur de performance, calé sur la hauteur de la tête de courbe.
        const perf = ((c.y0 - head.y) / (c.y0 - c.yEnd)) * 247.3;
        const val = document.getElementById('val');
        val.textContent = (perf < 0 ? '−' : '+') + Math.abs(perf).toFixed(1).replace('.', ',') + ' %';
        val.style.color = perf < 0 ? 'var(--down)' : 'var(--up)';
        document.querySelector('.counter').style.opacity = prog(t, 0.3, 0.5);

        // Surtitre façon machine à écrire.
        const n = Math.floor(clamp((t - 0.9) / 0.9) * EYEBROW.length);
        document.getElementById('eyebrowText').textContent = EYEBROW.slice(0, n);
        document.getElementById('caret').style.opacity = t < 0.9 ? 0 : (Math.floor(t * 3) % 2 ? 1 : 0.15);

        // Titre : chaque mot monte depuis un masque.
        c.words.forEach((w, i) => {
          const p = prog(t, 1.5 + i * 0.12, 0.8, ease.outExpo);
          w.style.transform = `translateY(${(1 - p) * 110}%)`;
        });
        const u = prog(t, 2.2, 0.8, ease.inOutExpo);
        document.getElementById('underline').style.transform = `scaleX(${u})`;

        // Bandeau de cotations défilant.
        document.getElementById('track').style.transform = `translateX(${-t * 160}px)`;
        document.querySelector('.ticker').style.transform = `translateY(${(1 - prog(t, 0.6, 0.7, ease.outExpo)) * 100}%)`;

        // Outro : balayage doré puis logo.
        const wipe = prog(t, 5.15, 0.9, ease.inOutCubic);
        document.getElementById('wipe').style.transform = `translateX(${wipe * 4400}px)`;
        const lp = prog(t, 5.7, 0.8, ease.outBack);
        const logo = document.getElementById('logo');
        logo.style.transform = `scale(${lp}) rotate(${(1 - lp) * -90}deg)`;
        const hp = prog(t, 5.95, 0.7, ease.outExpo);
        const handle = document.getElementById('handle');
        handle.style.opacity = hp;
        handle.style.transform = `translateY(${(1 - hp) * 40}px)`;
      },
    });
  </script>
</body>
</html>
