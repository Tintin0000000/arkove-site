<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#F7F8F6;}
  .c{
    width:800px;height:1280px;background:#F7F8F6;color:#16202A;position:relative;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:118px 86px;box-sizing:border-box;
    font-family:"Bricolage Grotesque","Inter","Liberation Sans",Arial,sans-serif;
  }
  .band{position:absolute;left:0;right:0;top:0;height:44px;background:#0E6B5C;}
  .mark{font-size:17px;letter-spacing:.3em;text-transform:uppercase;color:#0E6B5C;font-weight:600;}
  .rule{width:68px;height:5px;background:#0E6B5C;margin:30px 0 0;}
  h1{font-size:104px;line-height:.93;font-weight:800;letter-spacing:-.04em;margin:0 0 34px;}
  h1 span{display:block;color:#0E6B5C;}
  .sub{font-size:25px;line-height:1.42;color:#3A4A57;font-weight:400;max-width:560px;}
  .bot{font-size:18px;line-height:1.8;color:#6B7A86;}
  .chips{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;}
  .chip{border:2px solid #9FC4BB;border-radius:999px;padding:7px 17px;font-size:15px;
        color:#0E6B5C;letter-spacing:.07em;text-transform:uppercase;font-weight:600;}
  .line{height:2px;background:#D9E0E3;margin-bottom:20px;}
  .auth{font-size:23px;color:#16202A;font-weight:600;letter-spacing:.02em;}
</style></head><body>
<div class="c">
  <div class="band"></div>
  <div><div class="mark">Guide pratique</div><div class="rule"></div></div>
  <div>
    <h1>Argent<span>Maîtrisé</span></h1>
    <div class="sub">Du premier euro épargné au patrimoine qui travaille pour vous.</div>
  </div>
  <div class="bot">
    <div class="chips"><span class="chip">Débutant</span><span class="chip">Intermédiaire</span></div>
    <div class="line"></div>
    <div class="auth">[VOTRE NOM]</div>
    Budget · Épargne · PEA, assurance-vie, PER · Immobilier · Fiscalité · Transmission
  </div>
</div>
</body></html>
