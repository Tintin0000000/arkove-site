<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Espace Pierre-Lou</title>
  <link rel="cms-config-url" type="text/yaml" href="config.yml">
  <style>
    body { margin: 0; background: #F4ECE1; }
    .demo-bar {
      position: fixed; z-index: 99999; left: 50%; bottom: 14px; transform: translateX(-50%);
      max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px;
      background: #2B1A12; color: #FFFBF5; font: 600 14px/1.35 system-ui, sans-serif; text-align: center;
      box-shadow: 0 10px 30px rgba(38, 23, 15, .35);
    }
    .demo-bar b { color: #EE8A2B; }
    /* Decap impose 800 px de large à l'éditeur : on l'adapte au téléphone */
    @media (max-width: 820px) {
      [class*="-EditorContainer"], [class*="-ToolbarContainer"] { min-width: 0 !important; }
      [class*="-ToolbarContainer"] { overflow-x: auto; }
      [class*="-ControlPaneContainer"] { padding-left: 12px !important; padding-right: 12px !important; }
      .demo-bar { font-size: 12px; bottom: 8px; }
    }
  </style>
  <script>
    // Adresse du site en ligne. Ailleurs (maquette, aperçu), l'espace s'ouvre
    // en mode démonstration : pas de connexion, rien n'est enregistré.
    window.PL_PROD_HOSTS = ['pierrelou-auto.fr', 'www.pierrelou-auto.fr'];
    window.PL_DEMO = window.PL_PROD_HOSTS.indexOf(location.hostname) < 0;
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <script src="admin.js"></script>
</body>
</html>
